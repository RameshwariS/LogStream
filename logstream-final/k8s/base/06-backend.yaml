# ─────────────────────────────────────────────────────────────────────────────
# Backend — Node.js + Express + Socket.io
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: logstream
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: logstream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Wait for Loki before starting
      initContainers:
        - name: wait-for-loki
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://loki:3100/ready; do
                echo "Waiting for Loki..."; sleep 5;
              done
              echo "Loki ready — starting backend."

      containers:
        - name: backend
          image: logstream-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4000

          envFrom:
            - configMapRef:
                name: backend-config

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Graceful shutdown — gives Socket.io time to drain connections
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      # Spread replicas across nodes for availability
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend

---
# ─────────────────────────────────────────────────────────────────────────────
# Service: Backend
# Uses sessionAffinity: ClientIP so Socket.io sticky sessions work correctly
# when scaled to >1 replica (avoids polling fallback on reconnect).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: logstream
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 4000
      targetPort: http
  type: ClusterIP
  # Sticky sessions for Socket.io — essential for multi-replica deployments
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800   # 3 hours

---
# ─────────────────────────────────────────────────────────────────────────────
# HorizontalPodAutoscaler: Backend
# Scale 2→5 replicas based on CPU utilization.
# Requires metrics-server to be installed in the cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: logstream
  labels:
    app: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
