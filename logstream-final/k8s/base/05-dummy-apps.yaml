# ─────────────────────────────────────────────────────────────────────────────
# Dummy App 1 — JSON Logger
# Writes structured JSON logs to the shared log-data PVC at random intervals.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-app
  namespace: logstream
  labels:
    app: json-app
    app.kubernetes.io/name: json-app
    app.kubernetes.io/part-of: logstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: json-app
  template:
    metadata:
      labels:
        app: json-app
    spec:
      containers:
        - name: json-app
          # NOTE: replace with your registry image once pushed, e.g.:
          #   image: ghcr.io/<your-org>/logstream-json-app:latest
          image: logstream-json-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_FILE
              value: /logs/json-app.log
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: log-data

