# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: Loki configuration
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logstream
  labels:
    app: loki
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32

    compactor:
      working_directory: /loki/compactor
      shared_store: filesystem
      retention_enabled: true

    analytics:
      reporting_enabled: false

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: Promtail configuration
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: logstream
  labels:
    app: promtail
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: json-app
        static_configs:
          - targets: [localhost]
            labels:
              job: logstream
              app: json-app
              env: kubernetes
              __path__: /logs/json-app.log
        pipeline_stages:
          - json:
              expressions:
                level: level
                message: message
          - labels:
              level:

      - job_name: syslog-app
        static_configs:
          - targets: [localhost]
            labels:
              job: logstream
              app: syslog-app
              env: kubernetes
              __path__: /logs/syslog-app.log
        pipeline_stages:
          - regex:
              expression: '(?P<level>DEBUG|INFO|WARN|ERROR|NOTICE|CRIT)'
          - labels:
              level:

      - job_name: text-app
        static_configs:
          - targets: [localhost]
            labels:
              job: logstream
              app: text-app
              env: kubernetes
              __path__: /logs/text-app.log
        pipeline_stages:
          - regex:
              expression: '\[(?P<level>DEBUG|INFO|WARN|ERROR)\]'
          - labels:
              level:

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: Grafana datasource provisioning
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: logstream
  labels:
    app: grafana
data:
  loki.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        jsonData:
          maxLines: 1000
        version: 1
        editable: true

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: Grafana dashboard provisioning
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: logstream
  labels:
    app: grafana
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: LogStream
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: Grafana dashboard JSON
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: logstream
  labels:
    app: grafana
data:
  logstream.json: |
    {
      "title": "LogStream Overview",
      "uid": "logstream-overview",
      "version": 1,
      "schemaVersion": 38,
      "refresh": "5s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "logs", "title": "All Logs — Live Tail",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 12 },
          "targets": [{ "expr": "{job=\"logstream\"}", "refId": "A" }],
          "options": { "enableLogDetails": true, "showTime": true }
        },
        {
          "id": 2, "type": "logs", "title": "ERROR Logs",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "{job=\"logstream\", level=\"ERROR\"}", "refId": "A" }]
        },
        {
          "id": 3, "type": "logs", "title": "WARN Logs",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "{job=\"logstream\", level=\"WARN\"}", "refId": "A" }]
        }
      ]
    }

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: Backend environment
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: logstream
  labels:
    app: backend
data:
  PORT: "4000"
  LOKI_URL: "http://loki:3100"
  LOG_BUFFER_SIZE: "1000"
