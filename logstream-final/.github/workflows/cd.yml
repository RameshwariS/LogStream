name: CD — Push Images & Deploy

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  push-images:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build & push all images
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SERVICES=(
            "backend:backend"
            "frontend:frontend"
            "json-app:apps/json-logger"
            "syslog-app:apps/syslog-logger"
            "text-app:apps/text-logger"
          )
          for entry in "${SERVICES[@]}"; do
            IFS=':' read -r name context <<< "$entry"
            IMAGE="ghcr.io/${{ env.ORG }}/logstream-${name}:${TAG}"
            docker build -t "$IMAGE" "./$context"
            docker push "$IMAGE"
            echo "Pushed: $IMAGE"
          done

  update-k8s-manifests:
    name: Update image tags in prod overlay
    runs-on: ubuntu-latest
    needs: push-images
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update prod kustomization image tags
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i "s/newTag: .*/newTag: \"${TAG}\"/" k8s/overlays/prod/kustomization.yaml

      - name: Commit updated tags
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "chore: bump k8s prod image tags to ${GITHUB_REF_NAME}" || echo "No changes"
          git push
