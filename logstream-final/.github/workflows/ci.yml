name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend — install & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: node --check services/lokiService.js

  frontend-build:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker — build all images
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t logstream-backend ./backend
      - name: Build frontend image
        run: docker build -t logstream-frontend ./frontend
      - name: Build json-app image
        run: docker build -t logstream-json-app ./apps/json-logger
      - name: Build syslog-app image
        run: docker build -t logstream-syslog-app ./apps/syslog-logger
      - name: Build text-app image
        run: docker build -t logstream-text-app ./apps/text-logger
