version: '3.9'

services:

  # ── Grafana Loki — log storage ───────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: logstream-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - logstream

  # ── Promtail — log scraping agent ───────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.0
    container_name: logstream-promtail
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml
      - log-data:/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logstream

  # ── Dummy App 1: JSON logger ─────────────────────────────────────────────
  json-app:
    build:
      context: ./apps/json-logger
      dockerfile: Dockerfile
    container_name: logstream-json-app
    restart: unless-stopped
    volumes:
      - log-data:/logs
    environment:
      - LOG_FILE=/logs/json-app.log
    networks:
      - logstream

  # ── Dummy App 2: Syslog logger ───────────────────────────────────────────
  syslog-app:
    build:
      context: ./apps/syslog-logger
      dockerfile: Dockerfile
    container_name: logstream-syslog-app
    restart: unless-stopped
    volumes:
      - log-data:/logs
    environment:
      - LOG_FILE=/logs/syslog-app.log
    networks:
      - logstream

  # ── Dummy App 3: Plain-text logger ───────────────────────────────────────
  text-app:
    build:
      context: ./apps/text-logger
      dockerfile: Dockerfile
    container_name: logstream-text-app
    restart: unless-stopped
    volumes:
      - log-data:/logs
    environment:
      - LOG_FILE=/logs/text-app.log
    networks:
      - logstream

  # ── Backend — Node.js + Socket.io server ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logstream-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - LOKI_URL=http://loki:3100
      - LOG_BUFFER_SIZE=1000
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logstream

  # ── Frontend — React (nginx in prod, vite dev server otherwise) ─────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logstream-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - logstream

  # ── Grafana — optional dashboard UI for Loki ────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: logstream-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - logstream

volumes:
  loki-data:
  log-data:
  grafana-data:

networks:
  logstream:
    driver: bridge
