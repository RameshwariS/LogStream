server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── JSON logger ─────────────────────────────────────────────────────────────
  - job_name: json-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: logstream
          app: json-app
          env: development
          __path__: /logs/json-app.log

    pipeline_stages:
      # Parse the JSON fields so they become queryable labels
      - json:
          expressions:
            level: level
            message: message
      - labels:
          level:

  # ── Syslog logger ────────────────────────────────────────────────────────────
  - job_name: syslog-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: logstream
          app: syslog-app
          env: development
          __path__: /logs/syslog-app.log

    pipeline_stages:
      # Extract level from syslog priority keyword
      - regex:
          expression: '(?P<level>DEBUG|INFO|WARN|ERROR|NOTICE|CRIT)'
      - labels:
          level:

  # ── Plain-text logger ────────────────────────────────────────────────────────
  - job_name: text-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: logstream
          app: text-app
          env: development
          __path__: /logs/text-app.log

    pipeline_stages:
      - regex:
          expression: '\[(?P<level>DEBUG|INFO|WARN|ERROR)\]'
      - labels:
          level:
