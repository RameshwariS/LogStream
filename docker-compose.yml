version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logstream-backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - logstream

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logstream-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - logstream

  # ── Optional: uncomment when adding persistence ──────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: logstream-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - logstream

networks:
  logstream:
    driver: bridge
